# add Kubernetes deployment config
# Created: 2026-05-08 22:11:26
# Component: AI DevOps Assistant

apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment
  namespace: ai-devops
  labels:
    app: ai-devops-assistant
    component: feat
    version: "1.0.0"
data:
  config.yaml: |
    # add Kubernetes deployment config

    application:
      name: "AI DevOps Assistant"
      version: "1.0.0"
      description: "add Kubernetes deployment config"
      created: "2026-05-08 22:11:26"

    ai_engine:
      model_path: "/models/pipeline_optimizer"
      inference_batch_size: 32
      gpu_enabled: true
      model_version: "v1.2.0"

    devops_core:
      deployment_strategy: "blue_green"
      rollback_threshold: 0.95
      max_parallel_deployments: 5
      health_check_timeout: 300

    monitoring:
      metrics_retention: "30d"
      log_level: "INFO"
      alert_channels:
        - "slack"
        - "email"
        - "webhook"

    security:
      encryption_enabled: true
      audit_logging: true
      rbac_enabled: true

    performance:
      cache_ttl: 3600
      connection_pool_size: 20
      request_timeout: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: ai-devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-devops-assistant
      component: feat
  template:
    metadata:
      labels:
        app: ai-devops-assistant
        component: feat
    spec:
      containers:
      - name: ai-devops-container
        image: ai-devops-assistant:latest
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/config/config.yaml"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
